<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface tecnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/interface-tec.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>
<body>
    <header>
        <div class="info-header">
            <div class="logo">
                <h3>TechLancer</h3>
            </div>
            <div class="icons-header">
                <span class="material-icons">
                    search
                </span>
            </div>
        </div>
        <div style="align-items: center;" class info-header>
            <span  class="material-icons">
                circle_notifications
            </span>
            <span class="material-icons">
                email
                </span>
            <img style="height: 45px; width: 45px; border-radius: 50px; margin-left: 20px;" src="/assets/imagens/logo.jpg">
        </div>
    </header>

    <div id="desempenho">
        <div class="resumo-de-vendas">
            <h2>Desempenho</h2>
            <button>Vendas</button>
            <button>Metas</button>
            <button>Desempenho</button>
        </div>
    </div>
    <div id="notificacao">
        <div class="notificacao">
            <h2>Notificaçoes</h2>
            <button>Novos</button>
            <button>Pendentes</button>
            <button>Importantes</button>
        </div>
    </div>
    <div id="gestao-de-cliente">
        <div class="cadastro-de-cliente">
            <h2>Gestão de Clientes</h2>
            <button>Registrar Cliente</button>
            <button>Interações com Cliente</button>
        </div>
    </div>
    <div id="gestao-de-pedido">
        <div class="criacao-e-gerenciamento">
            <h2>Gestão de Pedidos</h2>
            <button>Criar pedidos</button>
            <button>Gerenciar Pedidos</button>
            <button>Meus Serviços</button>
        </div>
    </div>
</body>
</html>
